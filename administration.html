<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration conteneurs</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase.js"></script></head><body><header class="topbar"><h1>⚙️ Administration</h1><p>Programmer une tuile par chantier</p></header><main class="container"><div class="nav"><a class="btn secondary" href="dashboard.html">Dashboard</a><a class="btn secondary" href="index.html">Vue agent</a></div><section class="card"><h2>Ajouter un passage récurrent</h2><div class="form-grid"><input id="chantier" placeholder="Nom du chantier"><input id="adresse" placeholder="Adresse"><input id="agentNom" placeholder="Nom de l’agent"><input id="agentId" placeholder="Identifiant agent, ex. michel"><select id="action"><option value="sortie">Sortie</option><option value="rentree">Rentrée</option></select><select id="jour"><option>lundi</option><option>mardi</option><option>mercredi</option><option>jeudi</option><option>vendredi</option><option>samedi</option><option>dimanche</option></select><input id="debut" type="time"><input id="fin" type="time"><select id="frequence"><option value="toutes">Toutes les semaines</option><option value="paire">Semaines paires</option><option value="impaire">Semaines impaires</option></select></div><p><button class="ok" onclick="ajouter()">＋ Ajouter la tuile</button></p></section><section class="card" style="margin-top:16px"><h2>Passages programmés</h2><div class="table-wrap"><table><thead><tr><th>Chantier</th><th>Action</th><th>Jour</th><th>Agent</th><th>Horaire</th><th></th></tr></thead><tbody id="liste"></tbody></table></div></section></main><script>
const ids=['chantier','adresse','agentNom','agentId','action','jour','debut','fin','frequence'];
async function ajouter(){const v=Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value.trim()]));if(!v.chantier||!v.agentId||!v.jour||!v.action){alert('Chantier, agent, jour et action sont obligatoires.');return;}await db.collection('conteneurs_plannings').add({chantierNom:v.chantier,adresse:v.adresse,agentNom:v.agentNom||v.agentId,agentId:v.agentId.toLowerCase(),action:v.action,jour:v.jour,heureDebut:v.debut,heureFin:v.fin,frequence:v.frequence,actif:true,createdAt:firebase.firestore.FieldValue.serverTimestamp()});document.getElementById('chantier').value='';document.getElementById('adresse').value='';charger();}
async function supprimer(id){if(confirm('Supprimer cette programmation ?'))await db.collection('conteneurs_plannings').doc(id).delete();}
async function charger(){const snap=await db.collection('conteneurs_plannings').orderBy('jour').get();const data=[];snap.forEach(d=>data.push({id:d.id,...d.data()}));document.getElementById('liste').innerHTML=data.map(p=>`<tr><td><strong>${p.chantierNom}</strong><br><span class="meta">${p.adresse||''}</span></td><td>${p.action==='sortie'?'Sortie':'Rentrée'}</td><td>${p.jour}<br><span class="meta">${p.frequence}</span></td><td>${p.agentNom||p.agentId}<br><span class="meta">Lien : ?agent=${p.agentId}</span></td><td>${p.heureDebut||'—'}–${p.heureFin||'—'}</td><td><button class="danger" onclick="supprimer('${p.id}')">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucune programmation.</td></tr>'}
charger();
</script></body></html>
