<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mes conteneurs</title><link rel="stylesheet" href="style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase.js"></script></head><body><header class="topbar"><h1>🗑️ Mes passages du jour</h1><p id="agentLabel">Chargement…</p></header><main class="container"><div class="nav"><a class="btn secondary" href="dashboard.html">Dashboard</a></div><div id="tiles" class="grid"></div></main><script>
const params=new URLSearchParams(location.search);const agent=(params.get('agent')||'').trim().toLowerCase();
const label=document.getElementById('agentLabel');const tiles=document.getElementById('tiles');
label.textContent=agent?`Agent : ${agent}`:'Aucun agent indiqué dans le lien';
async function charger(){if(!agent){tiles.innerHTML='<div class="card empty">Ajoute ?agent=prenom dans le lien.</div>';return;}const [plansSnap,pointsSnap]=await Promise.all([db.collection('conteneurs_plannings').where('agentId','==',agent).get(),db.collection('conteneurs_pointages').where('date','==',dateISO()).get()]);const points={};pointsSnap.forEach(d=>points[d.id]=d.data());const plans=[];plansSnap.forEach(d=>{const p={id:d.id,...d.data()};if(planningActifAujourdHui(p))plans.push(p)});plans.sort((a,b)=>(a.heureDebut||'').localeCompare(b.heureDebut||''));if(!plans.length){tiles.innerHTML='<div class="card empty">Aucun passage prévu aujourd’hui.</div>';return;}tiles.innerHTML=plans.map(p=>tuile(p,points[idPointage(p.id)])).join('');}
function tuile(p,point){const statut=point?.statut||'afaire';const cls=statut==='fait'?'done':statut==='probleme'?'problem':'';return `<section class="tile ${cls}" id="tile-${p.id}"><h2>${p.chantierNom}</h2><div class="address">${p.adresse||''}</div><div class="action ${p.action}">${p.action==='sortie'?'⬆️ SORTIE DES CONTENEURS':'⬇️ RENTRÉE DES CONTENEURS'}</div><div class="meta">Prévu : ${p.heureDebut||'—'} à ${p.heureFin||'—'}</div>${point?`<p><strong>${statut==='fait'?'✅ Effectué':'⚠️ Problème signalé'}</strong><br><span class="meta">${point.heure||''}${point.motif?' — '+point.motif:''}</span></p>`:`<div class="buttons"><button class="ok" onclick="valider('${p.id}','fait')">✅ FAIT</button><button class="warning" onclick="valider('${p.id}','probleme')">⚠️ SIGNALER UN PROBLÈME</button></div>`}</section>`}
async function valider(id,statut){let motif='';if(statut==='probleme'){motif=prompt('Quel est le problème ?')||'Problème non précisé';}const now=new Date();await db.collection('conteneurs_pointages').doc(idPointage(id)).set({planningId:id,agentId:agent,date:dateISO(now),heure:now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),statut,motif,createdAt:firebase.firestore.FieldValue.serverTimestamp()});charger();}
charger().catch(e=>tiles.innerHTML=`<div class="card empty">Erreur : ${e.message}</div>`);
</script></body></html>
