<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>Mes conteneurs</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="firebase.js?v=20260927-livedashboard1"></script>
  <script src="auth-ui.js?v=20260927-linkedagents2"></script>
  <style>
    .container-type{display:inline-flex;align-items:center;gap:7px;margin:12px 0 4px;padding:7px 11px;border-radius:999px;background:#eef2ff;color:#3730a3;font-weight:800;font-size:13px}
    .status-message{padding:12px;border-radius:12px;background:#f8fafc;margin-top:10px}
    .correction-zone{margin-top:10px;padding-top:10px;border-top:1px solid #dbe4df}
    .correction-btn{width:100%;background:#fff;color:#475569;border:1px solid #cbd5e1}
    .correction-btn:hover{background:#f8fafc}
    .replacement-notice{margin:10px 0 2px;padding:9px 11px;border-radius:11px;background:#fff7ed;color:#9a3412;font-size:13px;font-weight:700}
    .planning-source{display:inline-flex;margin:8px 0 0;padding:4px 8px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:11px;font-weight:800}
    .mission-window{margin:9px 0 0;padding:8px 10px;border-radius:10px;background:#eff6ff;color:#1d4ed8;font-size:12px;font-weight:750}
    .mission-window.late{background:#fff7ed;color:#9a3412}
    button:disabled{opacity:.6;cursor:wait}
  </style>
</head>
<body>
  <header class="topbar">
    <h1>🗑️ Mes passages du jour</h1>
    <p id="agentLabel">Chargement…</p>
  </header>

  <main class="container">
    <div class="nav">
      <button class="btn secondary" type="button" onclick="deconnexion()">Déconnexion</button>
    </div>
    <div id="tiles" class="grid"><div class="card empty">Connexion en cours…</div></div>
  </main>

<script>
const params=new URLSearchParams(location.search);
const agent=(params.get('agent')||'').trim().toLowerCase();
const label=document.getElementById('agentLabel');
const tiles=document.getElementById('tiles');
const plansAffiches=new Map();
let arretEcoutePlans=null;
let arretEcoutePoints=null;
let timerRechargeAgent=null;

function echapper(texte=''){
  return String(texte).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

label.textContent=agent?`Agent : ${agent}`:'Aucun agent indiqué dans le lien';

async function charger(){
  if(!agent){
    tiles.innerHTML='<div class="card empty">Le lien de l’agent est incomplet.</div>';
    return;
  }

  const aujourdHui=new Date();
  const [plansSnap,pointsSnap]=await Promise.all([
    db.collection('conteneurs_plannings').get(),
    db.collection('conteneurs_pointages').where('date','==',dateISO(aujourdHui)).get()
  ]);

  const points={};
  pointsSnap.forEach(d=>points[d.id]=d.data());

  const actifs=[];
  plansSnap.forEach(d=>{
    const p={id:d.id,...d.data()};
    if(planningActifAujourdHui(p,aujourdHui))actifs.push(p);
  });
  const priorises=typeof prioriserMissionsPlanning==='function'?prioriserMissionsPlanning(actifs,aujourdHui):actifs;
  const candidats=[];
  priorises.forEach(p=>{
    const effectif=agentEffectifPourDate(p,aujourdHui);
    if(effectif.agentId===agent){
      p.effectif=effectif;
      candidats.push(p);
    }
  });
  const plans=typeof dedoublonnerPlanningsActifsInfos==='function'?dedoublonnerPlanningsActifsInfos(candidats,aujourdHui):candidats;
  plansAffiches.clear();
  plans.forEach(p=>plansAffiches.set(p.id,p));
  plans.sort((a,b)=>(a.heureDebut||'').localeCompare(b.heureDebut||''));

  if(plans.length){
    label.textContent=`Agent : ${plans[0].effectif.agentNom||agent}`;
  }else{
    label.textContent=`Agent : ${agent}`;
  }

  if(!plans.length){
    tiles.innerHTML='<div class="card empty">Aucun passage prévu aujourd’hui.</div>';
    return;
  }

  tiles.innerHTML=plans.map(p=>tuile(p,points[idPointage(p.id,aujourdHui)],aujourdHui)).join('');
}

function minutesHeure(valeur){
  const m=String(valeur||'').match(/^(\d{1,2}):(\d{2})$/);
  return m?Number(m[1])*60+Number(m[2]):null;
}

function etatHorairePlanning(p,date=new Date()){
  if(!(p?.managedByPlanning===true||p?.sourceSystem==='kontrol-planning'))return null;
  const debut=minutesHeure(p.heureDebut),fin=minutesHeure(p.heureFin);
  if(debut===null)return null;
  const maintenant=date.getHours()*60+date.getMinutes();
  const ouverture=Math.max(0,debut-30);
  if(maintenant<ouverture)return{phase:'avenir',peutValider:false,texte:`À venir · validation à partir de ${String(Math.floor(ouverture/60)).padStart(2,'0')}:${String(ouverture%60).padStart(2,'0')}`};
  if(fin!==null&&maintenant>fin)return{phase:'retard',peutValider:true,texte:`Créneau dépassé · prévu ${p.heureDebut||'—'}–${p.heureFin||'—'}`};
  return{phase:'actif',peutValider:true,texte:`Créneau actif · ${p.heureDebut||'—'}–${p.heureFin||'—'}`};
}

function tuile(p,point,date=new Date()){
  const statut=point?.statut||'afaire';
  const cls=statut==='fait'?'done':statut==='probleme'?'problem':'';
  const typeEffectif=typeof typeConteneurEffectif==='function'?typeConteneurEffectif(p,date):(p.typeConteneur||'Type non précisé');
  const type=echapper(typeEffectif||'Type non précisé');
  const effectif=p.effectif||agentEffectifPourDate(p,date);
  const remplacement=effectif.estRemplacant
    ? `<div class="replacement-notice">🔄 Remplacement temporaire de ${echapper(effectif.titulaireNom||effectif.titulaireId)}</div>`
    : '';
  const pilotePlanning=p?.managedByPlanning===true||p?.sourceSystem==='kontrol-planning';
  const horaire=etatHorairePlanning(p,date);
  const source=pilotePlanning?'<div class="planning-source">↔ Mission issue du Planning KONTROL</div>':'';

  const etat=point
    ? `<div class="status-message">
        <strong>${statut==='fait'?'✅ Effectué':'⚠️ Problème signalé'}</strong><br>
        <span class="meta">${echapper(point.heure||'')}${point.motif?' — '+echapper(point.motif):''}</span>
        <div class="correction-zone">
          <button class="correction-btn" type="button" onclick="corrigerSaisie('${p.id}',this)">↩ Corriger ma saisie</button>
        </div>
      </div>`
    : (horaire&&!horaire.peutValider
      ? `<div class="mission-window">${echapper(horaire.texte)}</div>`
      : `${horaire?`<div class="mission-window ${horaire.phase==='retard'?'late':''}">${echapper(horaire.texte)}</div>`:''}<div class="buttons">
        <button class="ok" type="button" onclick="valider('${p.id}','fait',this)">✅ FAIT</button>
        <button class="warning" type="button" onclick="valider('${p.id}','probleme',this)">⚠️ SIGNALER UN PROBLÈME</button>
      </div>`);

  return `<section class="tile ${cls}" id="tile-${p.id}">
    <h2>${echapper(p.chantierNom)}</h2>
    <div class="address">${echapper(p.adresse||'')}</div>
    ${remplacement}
    ${source}
    <div class="action ${p.action}">${p.action==='sortie'?'⬆️ SORTIE DES CONTENEURS':'⬇️ RENTRÉE DES CONTENEURS'}</div>
    <div class="container-type">🗑️ ${type}</div>
    <div class="meta">Prévu : ${echapper(p.heureDebut||'—')} à ${echapper(p.heureFin||'—')}</div>
    ${etat}
  </section>`;
}

async function valider(id,statut,bouton){
  let motif='';
  if(statut==='probleme'){
    const saisie=prompt('Quel est le problème ?');
    if(saisie===null)return;
    motif=saisie.trim()||'Problème non précisé';
  }

  const boutons=[...document.querySelectorAll(`#tile-${id} button`)];
  boutons.forEach(b=>b.disabled=true);
  const ancienTexte=bouton.textContent;
  bouton.textContent='Enregistrement…';

  const now=new Date();
  const planning=plansAffiches.get(id);
  const effectif=planning?.effectif||agentEffectifPourDate(planning||{},now);
  try{
    await db.collection('conteneurs_pointages').doc(idPointage(id,now)).set({
      planningId:id,
      agentId:effectif.agentId||agent,
      agentNom:effectif.agentNom||agent,
      titulaireAgentId:effectif.titulaireId||planning?.agentId||'',
      titulaireAgentNom:effectif.titulaireNom||planning?.agentNom||'',
      remplacementId:effectif.remplacementId||'',
      date:dateISO(now),
      heure:now.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}),
      statut,
      motif,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
    });
    await charger();
  }catch(e){
    boutons.forEach(b=>b.disabled=false);
    bouton.textContent=ancienTexte;
    alert(`Impossible d’enregistrer : ${e.message}`);
  }
}

async function corrigerSaisie(id,bouton){
  const confirmation=confirm('Annuler cette saisie pour pouvoir la refaire ?');
  if(!confirmation)return;

  bouton.disabled=true;
  const ancienTexte=bouton.textContent;
  bouton.textContent='Annulation…';

  try{
    await db.collection('conteneurs_pointages').doc(idPointage(id)).delete();
    await charger();
  }catch(e){
    bouton.disabled=false;
    bouton.textContent=ancienTexte;
    alert(`Impossible de corriger la saisie : ${e.message}`);
  }
}

function afficherErreurAgent(e){
  console.error(e);
  tiles.innerHTML=`<div class="card empty">Erreur : ${echapper(e.message)}</div>`;
}

function programmerRechargeAgent(){
  clearTimeout(timerRechargeAgent);
  timerRechargeAgent=setTimeout(()=>charger().catch(afficherErreurAgent),80);
}

function demarrerTempsReelAgent(){
  if(!arretEcoutePlans){
    arretEcoutePlans=db.collection('conteneurs_plannings').onSnapshot(programmerRechargeAgent,afficherErreurAgent);
  }
  if(!arretEcoutePoints){
    arretEcoutePoints=db.collection('conteneurs_pointages').where('date','==',dateISO()).onSnapshot(programmerRechargeAgent,afficherErreurAgent);
  }
}

afficherConnexion(()=>{
  demarrerTempsReelAgent();
  charger().catch(afficherErreurAgent);
});
</script>
</body>
</html>
